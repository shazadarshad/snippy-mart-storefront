<body>
  <div id="root">
    {/* Initial Splash Loader */}
    <style>
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        z-index: 99999;
        font-family: system-ui, sans-serif;
      }
      .loader-logo {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #0d9488, #7c3aed);
        border-radius: 14px;
        margin-bottom: 14px;
      }
      .loader-bar {
        width: 96px;
        height: 2px;
        background: rgba(15, 23, 42, 0.08);
        border-radius: 1px;
        overflow: hidden;
      }
      .loader-progress {
        width: 40%;
        height: 100%;
        background: #0d9488;
        animation: progress-slide 0.8s infinite ease-in-out;
      }
      @keyframes progress-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(280%); }
      }
    </style>
    <div class="initial-loader">
      <div class="loader-logo"></div>
      <div class="loader-bar">
        <div class="loader-progress"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- DMCA helper only if a badge node exists (avoids getAttribute crash) -->
  <script>
    (function () {
      function loadDmca() {
        if (!document.querySelector('[src*="dmca.com"], a[href*="dmca.com"], .dmca-badge')) return;
        var s = document.createElement('script');
        s.src = 'https://images.dmca.com/Badges/DMCABadgeHelper.min.js';
        s.async = true;
        document.body.appendChild(s);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadDmca);
      } else {
        loadDmca();
      }
    })();
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            // Force activate updated SW so /auto is not stuck on old chunks
            if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            registration.update();
            console.log('SW registered:', registration.scope);
          })
          .catch((error) => {
            console.log('SW registration failed:', error);
          });
      });
    }
  </script>
