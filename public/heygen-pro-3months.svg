  </g>
  <text x="400" y="555" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">HeyGen Pro</text>
  <text x="400" y="605" text-anchor="middle" fill="#c084fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="-0.4">3 Months</text>
  <text x="400" y="730" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="4">SNIPPY MART</text>
