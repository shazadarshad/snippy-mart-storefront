# Build Snippy Admin debug APK (no Android Studio needed on your PC).
# Download: GitHub → Actions → Build Admin APK → latest run → Artifacts → snippy-admin-apk
#
# Required secret: GOOGLE_SERVICES_JSON  (full contents of android/app/google-services.json)

name: Build Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - '.github/workflows/build-admin-apk.yml'

concurrency:
  group: build-admin-apk
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps
        run: npm ci

      - name: Build web assets (dist for Capacitor)
        run: npm run build

      - name: Ensure google-services secret present
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing secret GOOGLE_SERVICES_JSON. Add it in GitHub → Settings → Secrets → Actions (paste full google-services.json)."
            exit 1
          fi

      - name: Create Android project + inject Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          # Fresh android tree each CI run (android/ is gitignored)
          rm -rf android
          # Ensure push plugin is installed for native wiring
          npm ls @capacitor/push-notifications @capacitor/android @capacitor/core
          npx cap add android
          mkdir -p android/app
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          # Sanity: package must match Capacitor appId
          grep -q 'com.snippymart.admin' android/app/google-services.json \
            || { echo "package_name must be com.snippymart.admin"; exit 1; }
          npx cap sync android
          # Fail if native push plugin was not linked into Android project
          if ! grep -q 'push-notifications' android/capacitor.settings.gradle \
            && ! grep -rq 'pushnotifications\|push-notifications' android/app/capacitor.build.gradle android/capacitor.settings.gradle 2>/dev/null; then
            echo "::error::@capacitor/push-notifications not linked in Android project"
            cat android/capacitor.settings.gradle || true
            cat android/app/capacitor.build.gradle || true
            exit 1
          fi
          echo "--- capacitor.settings.gradle ---"
          cat android/capacitor.settings.gradle
          echo "--- app/capacitor.build.gradle ---"
          cat android/app/capacitor.build.gradle
          chmod +x android/gradlew

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snippy-admin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "### Snippy Admin APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **snippy-admin-apk** from this run's Artifacts, install on your phone, open Snippy Admin, log in, allow notifications." >> "$GITHUB_STEP_SUMMARY"
